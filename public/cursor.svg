<svg xmlns="http://www.w3.org/2000/svg" width="32" height="48" viewBox="0 0 32 48" shape-rendering="crispEdges">
  <!--
    8-bit pixel art arrow cursor
    Grid: 8 cols × 12 rows, each pixel = 4×4 SVG units
    Hotspot: top-left (0,0)

    Layout (■=black, □=white, ·=transparent):
    Row  0:  ■ · · · · · · ·
    Row  1:  ■ ■ · · · · · ·
    Row  2:  ■ □ ■ · · · · ·
    Row  3:  ■ □ □ ■ · · · ·
    Row  4:  ■ □ □ □ ■ · · ·
    Row  5:  ■ □ □ □ □ ■ · ·
    Row  6:  ■ □ □ □ □ □ ■ ·
    Row  7:  ■ □ □ □ ■ ■ ■ ·
    Row  8:  ■ □ □ ■ □ □ ■ ·
    Row  9:  ■ □ ■ · ■ □ □ ■
    Row 10:  ■ ■ · · · ■ □ ■
    Row 11:  ■ · · · · · ■ ■
  -->

  <!-- Black pixels -->
  <!-- Row 0 -->
  <rect x="0"  y="0"  width="4" height="4" fill="#000"/>
  <!-- Row 1 -->
  <rect x="0"  y="4"  width="4" height="4" fill="#000"/>
  <rect x="4"  y="4"  width="4" height="4" fill="#000"/>
  <!-- Row 2 -->
  <rect x="0"  y="8"  width="4" height="4" fill="#000"/>
  <rect x="8"  y="8"  width="4" height="4" fill="#000"/>
  <!-- Row 3 -->
  <rect x="0"  y="12" width="4" height="4" fill="#000"/>
  <rect x="12" y="12" width="4" height="4" fill="#000"/>
  <!-- Row 4 -->
  <rect x="0"  y="16" width="4" height="4" fill="#000"/>
  <rect x="16" y="16" width="4" height="4" fill="#000"/>
  <!-- Row 5 -->
  <rect x="0"  y="20" width="4" height="4" fill="#000"/>
  <rect x="20" y="20" width="4" height="4" fill="#000"/>
  <!-- Row 6 -->
  <rect x="0"  y="24" width="4" height="4" fill="#000"/>
  <rect x="24" y="24" width="4" height="4" fill="#000"/>
  <!-- Row 7 -->
  <rect x="0"  y="28" width="4" height="4" fill="#000"/>
  <rect x="16" y="28" width="4" height="4" fill="#000"/>
  <rect x="20" y="28" width="4" height="4" fill="#000"/>
  <rect x="24" y="28" width="4" height="4" fill="#000"/>
  <!-- Row 8 -->
  <rect x="0"  y="32" width="4" height="4" fill="#000"/>
  <rect x="12" y="32" width="4" height="4" fill="#000"/>
  <rect x="24" y="32" width="4" height="4" fill="#000"/>
  <!-- Row 9 -->
  <rect x="0"  y="36" width="4" height="4" fill="#000"/>
  <rect x="8"  y="36" width="4" height="4" fill="#000"/>
  <rect x="16" y="36" width="4" height="4" fill="#000"/>
  <rect x="28" y="36" width="4" height="4" fill="#000"/>
  <!-- Row 10 -->
  <rect x="0"  y="40" width="4" height="4" fill="#000"/>
  <rect x="4"  y="40" width="4" height="4" fill="#000"/>
  <rect x="20" y="40" width="4" height="4" fill="#000"/>
  <rect x="28" y="40" width="4" height="4" fill="#000"/>
  <!-- Row 11 -->
  <rect x="0"  y="44" width="4" height="4" fill="#000"/>
  <rect x="24" y="44" width="4" height="4" fill="#000"/>
  <rect x="28" y="44" width="4" height="4" fill="#000"/>

  <!-- White fill pixels -->
  <!-- Row 2 -->
  <rect x="4"  y="8"  width="4" height="4" fill="#fff"/>
  <!-- Row 3 -->
  <rect x="4"  y="12" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="12" width="4" height="4" fill="#fff"/>
  <!-- Row 4 -->
  <rect x="4"  y="16" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="16" width="4" height="4" fill="#fff"/>
  <rect x="12" y="16" width="4" height="4" fill="#fff"/>
  <!-- Row 5 -->
  <rect x="4"  y="20" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="20" width="4" height="4" fill="#fff"/>
  <rect x="12" y="20" width="4" height="4" fill="#fff"/>
  <rect x="16" y="20" width="4" height="4" fill="#fff"/>
  <!-- Row 6 -->
  <rect x="4"  y="24" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="24" width="4" height="4" fill="#fff"/>
  <rect x="12" y="24" width="4" height="4" fill="#fff"/>
  <rect x="16" y="24" width="4" height="4" fill="#fff"/>
  <rect x="20" y="24" width="4" height="4" fill="#fff"/>
  <!-- Row 7 -->
  <rect x="4"  y="28" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="28" width="4" height="4" fill="#fff"/>
  <rect x="12" y="28" width="4" height="4" fill="#fff"/>
  <!-- Row 8 -->
  <rect x="4"  y="32" width="4" height="4" fill="#fff"/>
  <rect x="8"  y="32" width="4" height="4" fill="#fff"/>
  <rect x="16" y="32" width="4" height="4" fill="#fff"/>
  <rect x="20" y="32" width="4" height="4" fill="#fff"/>
  <!-- Row 9 -->
  <rect x="4"  y="36" width="4" height="4" fill="#fff"/>
  <rect x="20" y="36" width="4" height="4" fill="#fff"/>
  <rect x="24" y="36" width="4" height="4" fill="#fff"/>
  <!-- Row 10 -->
  <rect x="24" y="40" width="4" height="4" fill="#fff"/>
</svg>
